services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - main_network
    environment:
      DB_URL: jdbc:postgresql://vps-6639755-x.dattaweb.com:5432/db_kayro
      DB_USER_NAME: postgres
      DB_PASSWORD: root
      SENDGRID_API_KEY: 7b2b43ebb13be494f1f1ab9382f425a0
      APP_MASTER_PASSWORD: Masterglobal2026$
      TZ: Etc/GMT+6
    restart: always

  frontend:
    build:
      context: frontend/
      args:
        VITE_API_BASE_URL: https://kayro.tech/api
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - main_network

networks:
  main_network:
    driver: bridge
